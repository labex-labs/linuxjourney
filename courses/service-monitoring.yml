translations:
  en:
    title: "Service Monitoring"
    description: "Read logs, metrics, and alerts to decide what to check when a service changes."
    faqs:
      - question: "Do I need a monitoring stack?"
        answer: "You can work through the lessons using the included request summaries, log excerpts, and small metric samples."
    meta_title: "Service Monitoring Course for Beginners"
    meta_description: "Read logs, metrics, and alerts to decide what to check when a service changes."
    meta_keywords: "service monitoring, Linux Journey, beginner course, devops"
  de:
    title: "Dienstüberwachung"
    description: "Lies Logs, Metriken und Warnmeldungen und entscheide, was du bei einer Veränderung am Dienst zuerst prüfen solltest."
    faqs:
      - question: "Brauche ich eine eigene Monitoring-Umgebung?"
        answer: "Du kannst die Lektionen mit den enthaltenen Anfrageübersichten, Logauszügen und kurzen Metrikbeispielen durcharbeiten."
    meta_title: "Dienstüberwachung für Einsteiger"
