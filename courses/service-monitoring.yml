  es:
    title: "Monitorización de servicios"
    description: "Lee registros, métricas y alertas para decidir qué comprobar cuando cambia el comportamiento de un servicio."
    faqs:
      - question: "¿Tengo que montar una plataforma de monitorización?"
        answer: "Puedes seguir las lecciones con los resúmenes de solicitudes, extractos de registros y pequeñas muestras de métricas que incluye el curso."
    meta_title: "Curso de monitorización de servicios para principiantes"
    meta_description: "Usa registros, tasas de error, latencia y métricas de recursos para entender qué ocurre con un servicio y dónde investigar."
