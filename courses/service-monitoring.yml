  fr:
    title: "Supervision des services"
    description: "Lisez des journaux, des métriques et des alertes pour savoir quoi vérifier quand un service change de comportement."
    faqs:
      - question: "Dois-je installer une plateforme de supervision ?"
        answer: "Vous pouvez suivre les leçons à partir des bilans de requêtes, des extraits de journaux et des exemples de métriques fournis."
    meta_title: "Cours de supervision des services pour débutants"
    meta_description: "Interprétez les journaux de requêtes, le taux d’erreur, la latence et les métriques de ressources pour examiner une alerte."
    meta_keywords: "supervision des services, journaux, métriques, latence, taux d’erreur, alertes, DevOps, Linux Journey"
  ja:
    title: "サービス監視"
    description: "ログ、メトリクス、アラートを読み、サービスの挙動に変化があったとき、何から確認するかを考えます。"
    faqs:
      - question: "監視システムを用意する必要はありますか？"
        answer: "レッスンにあるリクエストの集計、ログの抜粋、短いメトリクスのサンプルを使って学べます。"
    meta_title: "サービス監視入門"
    meta_description: "リクエストログ、エラー率、応答時間、リソースの使用状況を読み取り、アラートを調査の手がかりにします。"
    meta_keywords: "サービス監視, ログ, メトリクス, レイテンシ, エラー率, アラート, DevOps, Linux Journey"
  ko:
    title: "서비스 모니터링"
    description: "로그, 지표, 경보를 읽고 서비스의 동작이 달라졌을 때 무엇부터 확인할지 판단합니다."
    faqs:
      - question: "모니터링 시스템을 직접 구성해야 하나요?"
        answer: "레슨에 포함된 요청 요약, 로그 일부와 짧은 지표 예제를 이용해 학습할 수 있습니다."
    meta_title: "서비스 모니터링 입문 과정"
    meta_description: "요청 로그와 오류율, 응답 시간, 리소스 사용량을 살펴보고 경보를 조사 단서로 활용합니다."
    meta_keywords: "서비스 모니터링, 로그, 지표, 응답 시간, 오류율, 경보, DevOps, Linux Journey"
  pt:
    title: "Monitoramento de serviços"
    description: "Leia logs, métricas e alertas para decidir o que verificar quando um serviço muda de comportamento."
