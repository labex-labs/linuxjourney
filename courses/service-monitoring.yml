  zh:
    title: "服务监控"
    description: "结合日志、指标和告警，判断服务出现变化时应先查什么。"
    faqs:
      - question: "需要搭建一套监控系统吗？"
        answer: "课文提供请求汇总、日志片段和少量指标样本，可以直接用这些材料练习。"
    meta_title: "服务监控入门课程"
    meta_description: "学习用请求日志、错误率、延迟和资源指标分析服务问题，并从告警找到核查起点。"
    meta_keywords: "服务监控, 服务日志, 延迟, 错误率, 告警, DevOps, Linux Journey"
