  ru:
    title: "Мониторинг сервисов"
    description: "Читайте журналы, метрики и оповещения, чтобы понять, что проверить при изменении поведения сервиса."
    faqs:
      - question: "Нужно ли разворачивать систему мониторинга?"
        answer: "Для уроков достаточно сводок по запросам, фрагментов журналов и коротких примеров метрик, приведённых в курсе."
    meta_title: "Курс мониторинга сервисов для начинающих"
    meta_description: "Используйте журналы запросов, долю ошибок, задержки и метрики ресурсов, чтобы расследовать изменения и оповещения."
