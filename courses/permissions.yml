  en:
    title: "Permissions"
    description: "Learn about permission levels and modifying permissions."
    faqs:
      - question: "What permission concepts are covered?"
        answer: "The course explains read, write, and execute permissions; ownership; chmod; umask; process permissions; setuid; setgid; and the sticky bit."
      - question: "Do I need to understand octal permission notation?"
        answer: "The lessons help you connect symbolic and numeric permission forms, so you can read and modify permissions confidently."
      - question: "Can changing permissions create security risks?"
        answer: "Yes. Overly broad permissions or misuse of special bits can expose data or privileges, so the course emphasizes understanding each change before applying it."
    meta_title: "Linux File Permissions Course"
    meta_description: "Understand Linux file ownership and permissions, chmod, umask, process permissions, setuid, setgid, and the sticky bit through focused lessons."
