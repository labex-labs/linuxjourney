      - question: "Muss ich die oktale Berechtigungsnotation verstehen?"
        answer: "Die Lektionen zeigen den Zusammenhang zwischen symbolischer und numerischer Schreibweise, damit Sie Rechte sicher lesen und ändern können."
      - question: "Können geänderte Berechtigungen Sicherheitsrisiken mit sich bringen?"
        answer: "Ja. Zu weit gefasste Berechtigungen oder der Missbrauch spezieller Bits können Daten oder Privilegien offenlegen. Daher legt der Kurs Wert darauf, jede Änderung zu verstehen, bevor man sie anwendet."
