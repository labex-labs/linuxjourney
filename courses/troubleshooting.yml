  en:
    title: 'Troubleshooting'
    description: 'Learn about common networking tools to help you diagnose and troubleshoot issues!'
    faqs:
      - question: 'Which diagnostic tools are covered?'
        answer: 'The course covers ICMP, ping, traceroute, netstat-style connection inspection, and packet analysis for investigating connectivity and traffic flow.'
      - question: 'What troubleshooting order should I use?'
        answer: 'Start with the symptom and test progressively: local configuration, reachability, path behavior, listening services, connections, and packets when deeper evidence is needed.'
      - question: 'Do packet captures contain sensitive data?'
        answer: 'They can. Captures may include addresses, hostnames, protocol details, and unencrypted content, so collect and share them only with proper authorization.'
    meta_title: 'Linux Network Troubleshooting Course'
    meta_description: 'Diagnose Linux network problems with ICMP, ping, traceroute, socket inspection, netstat concepts, and packet analysis techniques.'
