translations:
  en:
    title: "Process Utilization"
    description: "Learn resource monitoring with top, load averages, iostat, and more!"
    faqs:
      - question: "Which monitoring areas are covered?"
        answer: "You will study CPU, memory, I/O, processes, threads, open files, continuous monitoring, and scheduled work so you can assess system activity as a whole."
      - question: "What tools will I learn to use?"
        answer: "The lessons introduce tools and concepts including top, load averages, iostat, lsof, fuser, process threads, and cron."
      - question: "Is this course useful for diagnosing slow systems?"
        answer: "Yes. It helps you distinguish CPU, memory, I/O, and process-related pressure before deciding where deeper investigation is needed."
    meta_title: "Linux Performance Monitoring Course"
    meta_description: "Monitor Linux CPU, memory, disk I/O, processes, threads, open files, scheduled jobs, and overall system activity with practical tools."
    meta_keywords: "Linux performance monitoring, top command, CPU monitoring, memory monitoring, iostat, lsof, cron jobs, process threads"
  de:
    title: "Prozessauslastung"
    description: "Lernen Sie die Ressourcenüberwachung mit top, Systemlast, iostat und weiteren Werkzeugen."
    faqs:
      - question: "Welche Überwachungsbereiche werden abgedeckt?"
        answer: "Sie studieren CPU, Speicher, E/A, Prozesse, Threads, offene Dateien, kontinuierliche Überwachung und geplante Arbeit, damit Sie die Systemaktivität als Ganzes beurteilen können."
      - question: "Mit welchen Werkzeugen werde ich lernen?"
        answer: "In den Lektionen werden Tools und Konzepte vorgestellt, darunter Top, Lastdurchschnitte, Iostat, LSOF, Fuser, Prozess-Threads und Cron."
      - question: "Ist dieser Kurs für die Diagnose langsamer Systeme nützlich?"
        answer: "Ja. Es hilft Ihnen, CPU-, Speicher-, E/A- und prozessbedingte Belastungen zu unterscheiden, bevor Sie entscheiden, wo eine tiefergehende Untersuchung erforderlich ist."
    meta_title: "Kurs zur Linux-Leistungsüberwachung"
    meta_description: "Überwachen Sie Linux-CPU, Speicher, Festplatten-E/A, Prozesse, Threads, geöffnete Dateien, geplante Jobs und die gesamte Systemaktivität mit praktischen Tools."
    meta_keywords: "Linux-Leistungsüberwachung, Top-Befehl, CPU-Überwachung, Speicherüberwachung, iostat, lsof, Cron-Jobs, Prozess-Threads"
  es:
