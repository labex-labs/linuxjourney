  ru:
    title: "Загрузка системы"
    description: "Узнайте об этапах процесса загрузки Linux."
    faqs:
      - question: "Какие этапы загрузки Linux описаны?"
        answer: "В курсе рассматривается запуск из BIOS через загрузчик, инициализацию ядра и систему инициализации, которая запускает службы и среду пользователя."
      - question: "Этот курс предназначен только для одного дистрибутива Linux?"
        answer: "Нет. Основная последовательность загрузки применяется в широком смысле, хотя встроенное ПО, настройки загрузчика и реализации инициализации могут различаться в зависимости от системы."
      - question: "Зачем мне изучать процесс загрузки?"
        answer: "Знание того, какой компонент запускается на каждом этапе, поможет вам обнаружить сбои при запуске и выбрать правильные журналы, конфигурацию или инструмент восстановления."
    meta_title: "Курс процесса загрузки Linux"
    meta_description: "Изучите каждый этап процесса загрузки Linux: от BIOS и загрузчика до инициализации ядра и системы инициализации."
    meta_keywords: "Процесс загрузки Linux, BIOS, загрузчик, GRUB, ядро Linux, система инициализации, запуск системы"
  zh:
    title: "启动系统"
    description: "了解 Linux 启动过程的各个阶段。"
    faqs:
      - question: "解释了 Linux 启动的哪些阶段？"
        answer: "本课程从 BIOS 启动，经过引导加载程序、内核初始化以及启动服务和用户环境的 init 系统。"
      - question: "本课程是否特定于某个 Linux 发行版？"
        answer: "否。尽管固件、引导加载程序设置和 init 实现可能因系统而异，但核心引导顺序广泛适用。"
      - question: "为什么要学习开机流程？"
        answer: "了解每个阶段运行的组件有助于定位启动失败并选择正确的日志、配置或恢复工具。"
