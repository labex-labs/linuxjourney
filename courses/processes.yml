    meta_description: "Aprenda como o Linux cria, rastreia, agenda, controla e finaliza processos usando ps, sinais, controle de tarefas, gentileza e o sistema de arquivos /proc."
    meta_keywords: "Processos Linux, comando ps, comando kill, sinais de processo, controle de tarefas, sistema de arquivos proc, estados de processo, nice"
  ru:
    title: "Процессы"
    description: "Узнайте о запущенных процессах в системе."
    faqs:
      - question: "Какие инструменты управления процессами я изучу?"
        answer: "Вы будете использовать концепции и инструменты, включая ps, kill, сигналы, управление заданиями, приоритетные и фоновые задания, корректность, терминалы и /proc."
      - question: "В чем разница между процессом и работой?"
        answer: "Процесс — это работающая программа, отслеживаемая ядром, а задание оболочки — это способ группировки и управления командами оболочки в сеансе."
      - question: "Полезен ли этот курс для устранения неполадок?"
        answer: "Да. Понимание состояний процессов, сигналов, приоритетов и завершения помогает безопасно исследовать медленные, зависшие или неправильно работающие программы."
    meta_title: "Курс процессов Linux"
    meta_description: "Узнайте, как Linux создает, отслеживает, планирует, контролирует и завершает процессы с помощью ps, сигналов, управления заданиями, корректности и файловой системы /proc."
    meta_keywords: "Процессы Linux, команда ps, команда kill, сигналы процессов, управление заданиями, файловая система proc, состояния процессов, nice"
  zh:
    title: "进程"
    description: "了解系统上运行的进程。"
    faqs:
      - question: "我将学习哪些流程管理工具？"
        answer: "您将使用包括 ps、kill、信号、作业控制、前台和后台作业、niceness、终端和 /proc 在内的概念和工具。"
      - question: "进程和作业有什么区别？"
        answer: "进程是由内核跟踪的正在运行的程序，而 shell 作业是 shell 在会话中分组和控制命令的方式。"
      - question: "本课程对于故障排除有用吗？"
        answer: "是的。了解进程状态、信号、优先级和终止可以帮助您安全地调查缓慢、卡住或行为异常的程序。"
    meta_title: "Linux 进程课程"
