translations:
  en:
    title: "Processes"
    description: "Learn about the running processes on the system."
    faqs:
      - question: "What process-management tools will I learn?"
        answer: "You will use concepts and tools including ps, kill, signals, job control, foreground and background jobs, niceness, terminals, and /proc."
      - question: "What is the difference between a process and a job?"
        answer: "A process is a running program tracked by the kernel, while a shell job is the shell’s way of grouping and controlling commands in a session."
      - question: "Is this course useful for troubleshooting?"
        answer: "Yes. Understanding process states, signals, priorities, and termination helps you investigate slow, stuck, or misbehaving programs safely."
    meta_title: "Linux Processes Course"
    meta_description: "Learn how Linux creates, tracks, schedules, controls, and terminates processes using ps, signals, job control, niceness, and the /proc filesystem."
    meta_keywords: "Linux processes, ps command, kill command, process signals, job control, proc filesystem, process states, nice"
  de:
    title: "Prozesse"
    description: "Lernen Sie die laufenden Prozesse auf dem System kennen."
    faqs:
      - question: "Welche Prozessmanagement-Tools werde ich erlernen?"
        answer: "Sie verwenden Konzepte und Tools wie ps, kill, Signale, Jobsteuerung, Vordergrund- und Hintergrundjobs, Niceness, Terminals und /proc."
      - question: "Was ist der Unterschied zwischen einem Prozess und einem Job?"
        answer: "Ein Prozess ist ein laufendes Programm, das vom Kernel verfolgt wird, während ein Shell-Job die Art und Weise ist, wie die Shell Befehle in einer Sitzung gruppiert und steuert."
      - question: "Ist dieser Kurs für die Fehlerbehebung nützlich?"
        answer: "Ja. Das Verständnis von Prozesszuständen, Signalen, Prioritäten und Beendigung hilft Ihnen, langsame, hängengebliebene oder sich schlecht verhaltende Programme sicher zu untersuchen."
    meta_title: "Linux-Prozesskurs"
    meta_description: "Erfahren Sie, wie Linux mithilfe von ps, Signalen, Jobsteuerung, Niceness und dem /proc-Dateisystem Prozesse erstellt, verfolgt, plant, steuert und beendet."
    meta_keywords: "Linux-Prozesse, ps-Befehl, kill-Befehl, Prozesssignale, Jobsteuerung, proc-Dateisystem, Prozesszustände, nice"
  es:
    title: "Procesos"
    description: "Aprende sobre los procesos en ejecución en el sistema."
    faqs:
      - question: "¿Qué herramientas de gestión de procesos aprenderé?"
        answer: "Utilizará conceptos y herramientas que incluyen ps, kill, señales, control de trabajos, trabajos en primer plano y en segundo plano, amabilidad, terminales y /proc."
      - question: "¿Cuál es la diferencia entre un proceso y un trabajo?"
        answer: "Un proceso es un programa en ejecución rastreado por el kernel, mientras que un trabajo de shell es la forma en que el shell agrupa y controla comandos en una sesión."
      - question: "¿Es útil este curso para solucionar problemas?"
        answer: "Sí. Comprender los estados de los procesos, las señales, las prioridades y la terminación le ayuda a investigar de forma segura programas lentos, atascados o que se comportan mal."
    meta_title: "Curso Procesos Linux"
    meta_description: "Aprenda cómo Linux crea, rastrea, programa, controla y finaliza procesos usando ps, señales, control de trabajo, amabilidad y el sistema de archivos /proc."
    meta_keywords: "Procesos de Linux, comando ps, comando kill, señales de proceso, control de trabajos, sistema de archivos proc, estados de proceso, nice"
  fr:
    title: "Processus"
    description: "Apprenez-en davantage sur les processus en cours d'exécution sur le système."
    faqs:
      - question: "Quels outils de gestion de processus vais-je apprendre ?"
        answer: "Vous utiliserez des concepts et des outils tels que ps, kill, signaux, contrôle des tâches, tâches de premier plan et d'arrière-plan, gentillesse, terminaux et /proc."
      - question: "Quelle est la différence entre un processus et un travail ?"
        answer: "Un processus est un programme en cours d'exécution suivi par le noyau, tandis qu'une tâche shell est le moyen utilisé par le shell pour regrouper et contrôler les commandes dans une session."
      - question: "Ce cours est-il utile pour le dépannage ?"
        answer: "Oui. Comprendre les états, les signaux, les priorités et l'arrêt des processus vous aide à enquêter en toute sécurité sur les programmes lents, bloqués ou qui se comportent mal."
    meta_title: "Cours sur les processus Linux"
    meta_description: "Découvrez comment Linux crée, suit, planifie, contrôle et termine les processus à l'aide de ps, de signaux, du contrôle des tâches, de la gentillesse et du système de fichiers /proc."
    meta_keywords: "Processus Linux, commande ps, commande kill, signaux de processus, contrôle des tâches, système de fichiers proc, états de processus, nice"
  ja:
    title: "プロセス"
    description: "システム上で実行されているプロセスについて学びましょう。"
    faqs:
      - question: "どのようなプロセス管理ツールを学習しますか？"
        answer: "ps、kill、シグナル、ジョブ制御、フォアグラウンドとバックグラウンドのジョブ、niceness、ターミナル、/proc などの概念とツールを使用します。"
      - question: "プロセスとジョブの違いは何ですか？"
        answer: "プロセスはカーネルによって追跡される実行中のプログラムであり、シェル ジョブはシェルがセッション内のコマンドをグループ化して制御する方法です。"
      - question: "このコースはトラブルシューティングに役立ちますか？"
        answer: "はい。プロセスの状態、信号、優先順位、終了を理解すると、遅いプログラム、スタックしたプログラム、または誤動作するプログラムを安全に調査するのに役立ちます。"
    meta_title: "Linux プロセス コース"
    meta_description: "Linux が ps、シグナル、ジョブ制御、niceness、および /proc ファイルシステムを使用してプロセスを作成、追跡、スケジュール、制御、および終了する方法を学びます。"
    meta_keywords: "Linux プロセス，ps コマンド，kill コマンド，プロセスシグナル，ジョブ制御，proc ファイルシステム，プロセス状態，nice"
  ko:
    title: "프로세스"
    description: "시스템에서 실행 중인 프로세스에 대해 배우세요."
    faqs:
      - question: "어떤 프로세스 관리 도구를 배우나요?"
        answer: "ps, kill, 신호, 작업 제어, 포그라운드 및 백그라운드 작업, niceness, 터미널 및 /proc 를 포함한 개념과 도구를 사용합니다."
      - question: "프로세스와 작업의 차이점은 무엇인가요?"
        answer: "프로세스는 커널이 추적하는 실행 중인 프로그램인 반면, 셸 작업은 세션에서 명령을 그룹화하고 제어하는 ​​셸의 방식입니다."
      - question: "이 과정이 문제 해결에 유용합니까?"
        answer: "네. 프로세스 상태, 신호, 우선 순위 및 종료를 이해하면 느리거나 멈추거나 오작동하는 프로그램을 안전하게 조사하는 데 도움이 됩니다."
    meta_title: "Linux 프로세스 과정"
    meta_description: "Linux 가 ps, 신호, 작업 제어, niceness 및 /proc 파일 시스템을 사용하여 프로세스를 생성, 추적, 예약, 제어 및 종료하는 방법을 알아보세요."
    meta_keywords: "Linux 프로세스, ps 명령, kill 명령, 프로세스 신호, 작업 제어, proc 파일 시스템, 프로세스 상태, nice"
  pt:
    title: "Processos"
    description: "Aprenda sobre os processos em execução no sistema."
    faqs:
      - question: "Quais ferramentas de gerenciamento de processos vou aprender?"
        answer: "Você usará conceitos e ferramentas, incluindo ps, kill, sinais, controle de tarefas, tarefas em primeiro e segundo plano, gentileza, terminais e /proc."
      - question: "Qual é a diferença entre um processo e um trabalho?"
        answer: "Um processo é um programa em execução rastreado pelo kernel, enquanto um shell job é a maneira do shell agrupar e controlar comandos em uma sessão."
      - question: "Este curso é útil para solução de problemas?"
        answer: "Sim. Compreender os estados, sinais, prioridades e encerramento do processo ajuda a investigar com segurança programas lentos, travados ou que se comportam mal."
