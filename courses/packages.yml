    faqs:
      - question: "어떤 패키지 관리자가 포함되나요?"
        answer: "이 과정에서는 Debian 기반 시스템의 경우 dpkg 및 apt, RPM 기반 시스템의 경우 rpm 및 yum, 그리고 패키지 및 저장소에 대한 공유 아이디어를 설명합니다."
      - question: "소스에서 소프트웨어를 설치하는 방법을 배울 수 있나요?"
        answer: "네. 이 강의에서는 압축된 아카이브와 소스 코드 획득, 컴파일, 설치를 위한 기본 작업 흐름을 소개합니다."
      - question: "Linux 배포판이 다른 패키지 도구를 사용하는 이유는 무엇입니까?"
        answer: "배포판은 다양한 패키지 형식과 저장소 생태계를 중심으로 소프트웨어를 구성하지만 종속성, 업데이트, 신뢰할 수 있는 소스가 일반적인 문제입니다."
    meta_title: "Linux 패키지 관리 강좌"
    meta_description: "Linux 소프트웨어 배포, 종속성, 리포지토리, 아카이브, 소스 빌드 및 apt, yum, dpkg 및 rpm 을 포함한 패키지 도구에 대해 알아보세요."
