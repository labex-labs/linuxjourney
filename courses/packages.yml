  ja:
    title: "パッケージ"
    description: "dpkg、apt-get、rpm、yum などのパッケージ管理ツールについて学びましょう。"
    faqs:
      - question: "どのパッケージ マネージャーが対象ですか？"
        answer: "このコースでは、Debian ベースのシステムの dpkg と apt、RPM ベースのシステムの rpm と yum、さらにパッケージとリポジトリの背後にある共通のアイデアについて説明します。"
      - question: "ソースからソフトウェアをインストールする方法を学ぶことになりますか？"
        answer: "はい。このレッスンでは、圧縮アーカイブと、ソース コードを取得、コンパイル、インストールするための基本的なワークフローを紹介します。"
      - question: "Linux ディストリビューションが異なるパッケージ ツールを使用するのはなぜですか？"
        answer: "ディストリビューションは、さまざまなパッケージ形式とリポジトリ エコシステムを中心にソフトウェアを編成しますが、依存関係、更新、信頼できるソースが共通の懸念事項となります。"
    meta_title: "Linux パッケージ管理コース"
    meta_description: "Linux ソフトウェアの配布、依存関係、リポジトリ、アーカイブ、ソース ビルド、および apt、yum、dpkg、rpm などのパッケージ ツールについて学びます。"
    meta_keywords: "Linux パッケージ管理，apt, yum, dpkg, rpm, パッケージ リポジトリ，依存関係，tar gzip, コンパイル ソース"
  ko:
