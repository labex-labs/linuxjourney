translations:
  en:
    title: "Packages"
    description: "Learn all about the dpkg, apt-get, rpm, and yum package management tools."
    faqs:
      - question: "Which package managers are covered?"
        answer: "The course explains dpkg and apt for Debian-based systems, rpm and yum for RPM-based systems, plus the shared ideas behind packages and repositories."
      - question: "Will I learn to install software from source?"
        answer: "Yes. The lessons introduce compressed archives and the basic workflow for obtaining, compiling, and installing source code."
      - question: "Why do Linux distributions use different package tools?"
        answer: "Distributions organize software around different package formats and repository ecosystems, but dependencies, updates, and trusted sources are common concerns."
    meta_title: "Linux Package Management Course"
    meta_description: "Learn Linux software distribution, dependencies, repositories, archives, source builds, and package tools including apt, yum, dpkg, and rpm."
    meta_keywords: "Linux package management, apt, yum, dpkg, rpm, package repositories, dependencies, tar gzip, compile source"
  de:
    title: "Pakete"
    description: "Erfahren Sie alles über die Paketverwaltungstools dpkg, apt-get, rpm und yum."
    faqs:
      - question: "Welche Paketmanager werden abgedeckt?"
        answer: "Der Kurs erklärt dpkg und apt für Debian-basierte Systeme, rpm und yum für RPM-basierte Systeme sowie die gemeinsamen Ideen hinter Paketen und Repositorys."
      - question: "Werde ich lernen, Software aus dem Quellcode zu installieren?"
        answer: "Ja. In den Lektionen werden komprimierte Archive und der grundlegende Arbeitsablauf zum Erhalten, Kompilieren und Installieren von Quellcode vorgestellt."
      - question: "Warum verwenden Linux-Distributionen unterschiedliche Pakettools?"
        answer: "Distributionen organisieren Software nach verschiedenen Paketformaten und Repository-Ökosystemen, aber Abhängigkeiten, Updates und vertrauenswürdige Quellen sind häufige Probleme."
    meta_title: "Linux-Paketverwaltungskurs"
    meta_description: "Lernen Sie die Linux-Softwareverteilung, Abhängigkeiten, Repositorys, Archive, Quell-Builds und Pakettools kennen, einschließlich apt, yum, dpkg und rpm."
    meta_keywords: "Linux-Paketverwaltung, apt, yum, dpkg, rpm, Paket-Repositorys, Abhängigkeiten, tar gzip, Kompilierungsquelle"
  es:
    title: "Paquetes"
    description: "Aprende a usar las herramientas de gestión de paquetes dpkg, apt-get, rpm y yum."
    faqs:
      - question: "¿Qué administradores de paquetes están cubiertos?"
        answer: "El curso explica dpkg y apt para sistemas basados ​​en Debian, rpm y yum para sistemas basados ​​en RPM, además de las ideas compartidas detrás de los paquetes y repositorios."
      - question: "¿Aprenderé a instalar software desde la fuente?"
        answer: "Sí. Las lecciones presentan archivos comprimidos y el flujo de trabajo básico para obtener, compilar e instalar código fuente."
      - question: "¿Por qué las distribuciones de Linux utilizan diferentes herramientas de paquetes?"
        answer: "Las distribuciones organizan el software en torno a diferentes formatos de paquetes y ecosistemas de repositorio, pero las dependencias, las actualizaciones y las fuentes confiables son preocupaciones comunes."
    meta_title: "Curso de Gestión de Paquetes Linux"
    meta_description: "Aprenda la distribución de software de Linux, las dependencias, los repositorios, los archivos, las compilaciones de fuentes y las herramientas de paquetes, incluidos apt, yum, dpkg y rpm."
    meta_keywords: "Gestión de paquetes de Linux, apt, yum, dpkg, rpm, repositorios de paquetes, dependencias, tar gzip, código fuente de compilación"
  fr:
    title: "Packages"
    description: "Apprenez à utiliser les outils de gestion de paquets dpkg, apt-get, rpm et yum."
    faqs:
      - question: "Quels gestionnaires de paquets sont couverts ?"
        answer: "Le cours explique dpkg et apt pour les systèmes basés sur Debian, rpm et yum pour les systèmes basés sur RPM, ainsi que les idées partagées derrière les packages et les référentiels."
      - question: "Vais-je apprendre à installer un logiciel à partir des sources ?"
        answer: "Oui. Les leçons présentent les archives compressées et le flux de travail de base pour obtenir, compiler et installer le code source."
      - question: "Pourquoi les distributions Linux utilisent-elles des outils de package différents ?"
        answer: "Les distributions organisent les logiciels autour de différents formats de packages et écosystèmes de référentiels, mais les dépendances, les mises à jour et les sources fiables sont des préoccupations courantes."
    meta_title: "Cours de gestion des packages Linux"
