translations:
  en:
    title: "Advanced Text-Fu"
    description: "Navigate text like a Linux spider monkey with Vim and Emacs."
    faqs:
      - question: "What editors are taught in this course?"
        answer: "The course introduces both Vim and Emacs, covering navigation, editing, file operations, help, search patterns, and safe ways to exit each editor."
      - question: "Do I need to master both Vim and Emacs?"
        answer: "No. Learning the fundamentals of both helps you work on unfamiliar systems, but you can choose one editor for deeper daily use."
      - question: "Are regular expressions included?"
        answer: "Yes. A dedicated lesson explains regular expressions so you can recognize patterns and perform more powerful searches in editors and command-line tools."
    meta_title: "Vim, Emacs, and Regex Course"
    meta_description: "Develop advanced Linux text-editing skills with Vim and Emacs, including navigation, editing, search, file operations, and regular expressions."
    meta_keywords: "Vim tutorial, Emacs tutorial, regular expressions, Linux text editor, Vim navigation, Vim search, Emacs editing"
  de:
    title: "Fortgeschrittenes Text-Fu"
    description: "Navigieren Sie Text wie ein Linux-Spinnenaffe mit Vim und Emacs."
    faqs:
      - question: "Welche Redakteure werden in diesem Kurs unterrichtet?"
        answer: "Der Kurs stellt sowohl Vim als auch Emacs vor und behandelt Navigation, Bearbeitung, Dateioperationen, Hilfe, Suchmuster und sichere Möglichkeiten zum Beenden jedes Editors."
      - question: "Muss ich sowohl Vim als auch Emacs beherrschen?"
        answer: "Nein. Das Erlernen der Grundlagen beider Systeme hilft Ihnen bei der Arbeit mit unbekannten Systemen, aber Sie können einen Editor für den tieferen täglichen Gebrauch auswählen."
      - question: "Sind reguläre Ausdrücke enthalten?"
        answer: "Ja. In einer speziellen Lektion werden reguläre Ausdrücke erläutert, damit Sie Muster erkennen und leistungsfähigere Suchvorgänge in Editoren und Befehlszeilentools durchführen können."
    meta_title: "Vim-, Emacs- und Regex-Kurs"
    meta_description: "Entwickeln Sie fortgeschrittene Linux-Textbearbeitungsfähigkeiten mit Vim und Emacs, einschließlich Navigation, Bearbeitung, Suche, Dateioperationen und regulären Ausdrücken."
    meta_keywords: "Vim-Tutorial, Emacs-Tutorial, reguläre Ausdrücke, Linux-Texteditor, Vim-Navigation, Vim-Suche, Emacs-Bearbeitung"
  es:
    title: "Text-Fu Avanzado"
    description: "Navega texto como un mono araña de Linux con Vim y Emacs."
    faqs:
      - question: "¿Qué editores se enseñan en este curso?"
        answer: "El curso presenta Vim y Emacs, y cubre navegación, edición, operaciones de archivos, ayuda, patrones de búsqueda y formas seguras de salir de cada editor."
      - question: "¿Necesito dominar Vim y Emacs?"
        answer: "No. Aprender los fundamentos de ambos te ayuda a trabajar en sistemas desconocidos, pero puedes elegir un editor para un uso diario más profundo."
      - question: "¿Se incluyen expresiones regulares?"
        answer: "Sí. Una lección dedicada explica las expresiones regulares para que pueda reconocer patrones y realizar búsquedas más potentes en editores y herramientas de línea de comandos."
