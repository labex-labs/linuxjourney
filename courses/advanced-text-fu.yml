  ja:
    title: "高度なテキスト操作"
    description: "Vim と Emacs を使って、Linux のクモザルのようにテキストを操作しましょう。"
    faqs:
      - question: "このコースではどのような編集者が教えられますか？"
        answer: "このコースでは Vim と Emacs の両方を紹介し、ナビゲーション、編集、ファイル操作、ヘルプ、検索パターン、各エディターを安全に終了する方法を取り上げます。"
      - question: "Vim と Emacs の両方をマスターする必要がありますか？"
        answer: "いいえ。両方の基本を学習すると、不慣れなシステムで作業するのに役立ちますが、日常的により深く使用するために 1 つのエディタを選択することもできます。"
      - question: "正規表現は含まれていますか？"
        answer: "はい。専用のレッスンでは正規表現について説明しているので、パターンを認識し、エディターやコマンドライン ツールでより強力な検索を実行できるようになります。"
