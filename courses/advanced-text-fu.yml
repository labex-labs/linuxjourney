    faqs:
      - question: "이 강좌에서는 어떤 편집자를 가르치나요?"
        answer: "이 과정에서는 Vim 과 Emacs 를 모두 소개하며 탐색, 편집, 파일 작업, 도움말, 검색 패턴, 각 편집기를 안전하게 종료하는 방법을 다룹니다."
      - question: "Vim 과 Emacs 를 모두 마스터해야 하나요?"
        answer: "아니요. 두 가지의 기본 사항을 배우는 것은 익숙하지 않은 시스템에서 작업하는 데 도움이 되지만 일상적으로 더 깊이 있게 사용하려면 하나의 편집기를 선택할 수도 있습니다."
      - question: "정규 표현식이 포함되어 있나요?"
        answer: "네. 전용 강의에서는 패턴을 인식하고 편집기와 명령줄 도구에서 더욱 강력한 검색을 수행할 수 있도록 정규식을 설명합니다."
