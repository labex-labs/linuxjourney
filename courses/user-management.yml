        answer: "Linux 가 계정, 비밀번호 및 그룹 정보를 저장하는 방법을 포함하여 /etc/passwd, /etc/shadow 및 /etc/group의 역할을 학습합니다."
      - question: "어떤 사용자 관리 작업이 다루나요?"
        answer: "이 강의에서는 사용자 및 그룹, 루트 액세스, 계정 파일, 계정 생성, 수정, 검사 및 제거를 위한 일반 도구를 다룹니다."
      - question: "이 수업에는 관리자 액세스 권한이 필요합니까?"
