translations:
  en:
    title: "User Management"
    description: "Learn about user roles and management."
    faqs:
      - question: "What account files does this course explain?"
        answer: "You will learn the roles of /etc/passwd, /etc/shadow, and /etc/group, including how Linux stores account, password, and group information."
      - question: "Which user-management tasks are covered?"
        answer: "The lessons cover users and groups, root access, account files, and common tools for creating, modifying, inspecting, and removing accounts."
      - question: "Do these lessons require administrator access?"
        answer: "Reading the explanations does not, but many account changes require root or sudo privileges. Practice only in a system where you are authorized to administer users."
    meta_title: "Linux User Management Course"
    meta_description: "Learn Linux users and groups, account databases, root privileges, passwords, and practical commands for safely managing local user accounts."
    meta_keywords: "Linux user management, users and groups, passwd file, shadow file, root user, useradd, group management"
  de:
    title: "Benutzerverwaltung"
    description: "Lernen Sie Benutzerrollen und -verwaltung kennen."
    faqs:
      - question: "Welche Kontodateien werden in diesem Kurs erklärt?"
        answer: "Sie lernen die Rollen von /etc/passwd, /etc/shadow und /etc/group kennen, einschließlich der Art und Weise, wie Linux Konto-, Passwort- und Gruppeninformationen speichert."
      - question: "Welche Aufgaben der Benutzerverwaltung werden abgedeckt?"
        answer: "Die Lektionen behandeln Benutzer und Gruppen, Root-Zugriff, Kontodateien und gängige Tools zum Erstellen, Ändern, Überprüfen und Entfernen von Konten."
      - question: "Ist für diese Lektionen Administratorzugriff erforderlich?"
        answer: "Das Lesen der Erklärungen reicht nicht aus, aber viele Kontoänderungen erfordern Root- oder Sudo-Rechte. Üben Sie nur in einem System, in dem Sie berechtigt sind, Benutzer zu verwalten."
    meta_title: "Linux-Benutzerverwaltungskurs"
    meta_description: "Lernen Sie Linux-Benutzer und -Gruppen, Kontodatenbanken, Root-Rechte, Passwörter und praktische Befehle für die sichere Verwaltung lokaler Benutzerkonten kennen."
    meta_keywords: "Linux-Benutzerverwaltung, Benutzer und Gruppen, Passwd-Datei, Schattendatei, Root-Benutzer, Benutzer hinzufügen, Gruppenverwaltung"
  es:
    title: "Gestión de Usuarios"
    description: "Aprende sobre los roles y la gestión de usuarios."
    faqs:
      - question: "¿Qué archivos de cuenta explica este curso?"
        answer: "Aprenderá las funciones de /etc/passwd, /etc/shadow y /etc/group, incluido cómo Linux almacena la información de cuentas, contraseñas y grupos."
      - question: "¿Qué tareas de gestión de usuarios están cubiertas?"
        answer: "Las lecciones cubren usuarios y grupos, acceso raíz, archivos de cuentas y herramientas comunes para crear, modificar, inspeccionar y eliminar cuentas."
      - question: "¿Estas lecciones requieren acceso de administrador?"
        answer: "Leer las explicaciones no, pero muchos cambios de cuenta requieren privilegios de root o sudo. Practique sólo en un sistema donde esté autorizado a administrar usuarios."
    meta_title: "Curso de Gestión de Usuarios de Linux"
    meta_description: "Aprenda los usuarios y grupos de Linux, las bases de datos de cuentas, los privilegios de root, las contraseñas y los comandos prácticos para administrar de forma segura las cuentas de usuarios locales."
    meta_keywords: "Gestión de usuarios de Linux, usuarios y grupos, archivo passwd, archivo sombra, usuario root, useradd, gestión de grupos"
  fr:
    title: "Gestion des Utilisateurs"
    description: "Apprenez-en davantage sur les rôles et la gestion des utilisateurs."
    faqs:
      - question: "Quels fichiers de compte ce cours explique-t-il ?"
        answer: "Vous apprendrez les rôles de /etc/passwd, /etc/shadow et /etc/group, y compris la manière dont Linux stocke les informations de compte, de mot de passe et de groupe."
      - question: "Quelles tâches de gestion des utilisateurs sont couvertes ?"
        answer: "Les leçons couvrent les utilisateurs et les groupes, l'accès root, les fichiers de compte et les outils courants pour créer, modifier, inspecter et supprimer des comptes."
      - question: "Ces leçons nécessitent-elles un accès administrateur ?"
        answer: "La lecture des explications ne l'est pas, mais de nombreuses modifications de compte nécessitent les privilèges root ou sudo. Entraînez-vous uniquement dans un système où vous êtes autorisé à administrer des utilisateurs."
    meta_title: "Cours de gestion des utilisateurs Linux"
    meta_description: "Découvrez les utilisateurs et groupes Linux, les bases de données de comptes, les privilèges root, les mots de passe et les commandes pratiques pour gérer en toute sécurité les comptes d'utilisateurs locaux."
    meta_keywords: "Gestion des utilisateurs Linux, utilisateurs et groupes, fichier passwd, fichier shadow, utilisateur root, useradd, gestion de groupe"
  ja:
    title: "ユーザー管理"
    description: "ユーザーの役割と管理について学びましょう。"
    faqs:
      - question: "このコースではどのようなアカウント ファイルについて説明しますか？"
        answer: "Linux がアカウント、パスワード、グループ情報を保存する方法など、/etc/passwd、/etc/shadow、/etc/group の役割を学びます。"
      - question: "どのユーザー管理タスクが対象になりますか？"
        answer: "このレッスンでは、ユーザーとグループ、root アクセス、アカウント ファイル、およびアカウントを作成、変更、検査、削除するための一般的なツールについて説明します。"
      - question: "これらのレッスンには管理者アクセスが必要ですか？"
        answer: "説明を読んでもわかりませんが、多くのアカウント変更には root または sudo 権限が必要です。ユーザーを管理する権限を与えられたシステム内でのみ実践してください。"
    meta_title: "Linux ユーザー管理コース"
    meta_description: "Linux ユーザーとグループ、アカウント データベース、root 権限、パスワード、ローカル ユーザー アカウントを安全に管理するための実用的なコマンドについて学びます。"
    meta_keywords: "Linux ユーザー管理，ユーザーとグループ，パスワード ファイル，シャドウ ファイル，root ユーザー, useradd, グループ管理"
  ko:
    title: "사용자 관리"
