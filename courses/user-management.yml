    description: "Aprenda sobre funções e gerenciamento de usuários."
    faqs:
      - question: "Quais arquivos de conta este curso explica?"
        answer: "Você aprenderá as funções de /etc/passwd, /etc/shadow e /etc/group, incluindo como o Linux armazena informações de contas, senhas e grupos."
      - question: "Quais tarefas de gerenciamento de usuários são abordadas?"
        answer: "As lições abrangem usuários e grupos, acesso root, arquivos de contas e ferramentas comuns para criar, modificar, inspecionar e remover contas."
