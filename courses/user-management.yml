  ru:
    title: "Управление пользователями"
    description: "Узнайте о ролях пользователей и управлении."
    faqs:
      - question: "Какие файлы учетных записей рассматриваются в этом курсе?"
        answer: "Вы узнаете роли /etc/passwd, /etc/shadow и /etc/group, в том числе то, как Linux хранит информацию об учетной записи, пароле и группе."
      - question: "Какие задачи управления пользователями рассматриваются?"
        answer: "Уроки охватывают пользователей и группы, корневой доступ, файлы учетных записей и общие инструменты для создания, изменения, проверки и удаления учетных записей."
      - question: "Требуются ли для этих уроков доступ администратора?"
        answer: "Чтение объяснений не требует, но для многих изменений учетной записи требуются права root или sudo. Практикуйтесь только в системе, где вам разрешено администрировать пользователей."
    meta_title: "Курс управления пользователями Linux"
