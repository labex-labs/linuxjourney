      - question: "Which init systems are covered?"
        answer: "The course covers System V, Upstart, and systemd, explaining their different approaches to starting, stopping, and organizing system services."
      - question: "Is systemd the main focus?"
        answer: "Systemd is important on modern distributions, but the historical System V and Upstart lessons help you understand older systems and the evolution of service management."
      - question: "Does the course cover shutdown and reboot?"
        answer: "Yes. The power-states lesson explains common ways to halt, power off, and restart Linux systems safely."
