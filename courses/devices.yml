  ru:
    title: "Устройства"
    description: "Узнайте об устройствах Linux и их взаимодействии с ядром и пространством пользователя."
    faqs:
      - question: "Как Linux представляет аппаратные устройства?"
        answer: "Linux предоставляет доступ к устройствам через специальные файлы в /dev и информацию в sysfs, в то время как udev динамически управляет узлами устройств и связанными с ними событиями."
      - question: "Какие инструменты проверки оборудования включены?"
        answer: "В курсе представлены lsusb, lspci и lsscsi для идентификации устройств USB, PCI и SCSI, а также общие соглашения об именах устройств Linux."
      - question: "Безопасно ли использовать команду dd?"
        answer: "dd может перезаписывать диски, если указано неправильное место назначения. Просмотрите каждый путь ввода и вывода и практикуйтесь только с одноразовыми файлами или устройствами, которые можно безопасно заменить."
    meta_title: "Курс по устройствам Linux"
    meta_description: "Узнайте, как Linux представляет оборудование и управляет им через /dev, sysfs, типы и имена устройств, udev, инструменты составления списка оборудования и команду dd."
    meta_keywords: "Устройства Linux, каталог dev, sysfs, udev, lsusb, lspci, lsscsi, команда dd, файлы устройств"
  zh:
    title: "设备"
    description: "了解 Linux 设备以及它们如何与 kernel 和用户空间交互。"
    faqs:
