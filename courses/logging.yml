    faqs:
      - question: "どの Linux ログについて説明されていますか？"
        answer: "このコースでは、一般的なシステム ログ、認証イベント、カーネル メッセージ、syslog、/var/log 下の共通ファイル、およびログ ローテーションについて説明します。"
      - question: "ログの場所はディストリビューションごとに異なりますか？"
        answer: "はい。ファイル名とログ サービスは異なる場合がありますが、このコースでは、システム上の関連するソースを識別するのに役立つ概念を学びます。"
      - question: "ログローテーションはなぜ必要ですか？"
        answer: "ローテーションは、有用な履歴を保持しながらストレージの増加を制限し、システムがディスクの枯渇を回避し、アーカイブされたログを管理しやすくするのに役立ちます。"
