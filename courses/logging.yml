      - question: "Les emplacements des journaux diffèrent-ils entre les distributions ?"
        answer: "Oui. Les noms de fichiers et les services de journalisation peuvent varier, mais le cours enseigne des concepts qui vous aident à identifier la source pertinente sur votre système."
