translations:
  en:
    title: "Logging"
    description: "Learn about system logs and the /var/log directory."
    faqs:
      - question: "Which Linux logs are explained?"
        answer: "The course covers general system logs, authentication events, kernel messages, syslog, common files under /var/log, and log rotation."
      - question: "Do log locations differ between distributions?"
        answer: "Yes. File names and logging services can vary, but the course teaches concepts that help you identify the relevant source on your system."
      - question: "Why is log rotation necessary?"
        answer: "Rotation limits storage growth while retaining useful history, helping systems avoid disk exhaustion and keeping archived logs manageable."
    meta_title: "Linux System Logging Course"
    meta_description: "Learn how Linux records system, authentication, and kernel events; find logs under /var/log; use syslog; and manage rotation and retention."
    meta_keywords: "Linux logs, var log, syslog, authentication logs, kernel logs, logrotate, system logging, log management"
  de:
    title: "Protokollierung"
    description: "Lernen Sie Systemprotokolle und das Verzeichnis /var/log kennen."
    faqs:
      - question: "Welche Linux-Protokolle werden erklärt?"
        answer: "Der Kurs behandelt allgemeine Systemprotokolle, Authentifizierungsereignisse, Kernel-Meldungen, Syslog, allgemeine Dateien unter /var/log und Protokollrotation."
      - question: "Unterscheiden sich die Protokollspeicherorte zwischen den Distributionen?"
        answer: "Ja. Dateinamen und Protokollierungsdienste können variieren, der Kurs vermittelt jedoch Konzepte, die Ihnen helfen, die relevante Quelle auf Ihrem System zu identifizieren."
      - question: "Warum ist eine Protokollrotation notwendig?"
        answer: "Die Rotation begrenzt das Speicherwachstum und behält gleichzeitig den nützlichen Verlauf bei, hilft Systemen, eine Festplattenerschöpfung zu vermeiden und archivierte Protokolle überschaubar zu halten."
    meta_title: "Linux-Systemprotokollierungskurs"
    meta_description: "Lernen Sie, wie Linux System-, Authentifizierungs- und Kernelereignisse protokolliert, wie Sie Logs unter /var/log finden, syslog nutzen sowie Rotation und Aufbewahrung verwalten."
    meta_keywords: "Linux-Protokolle, /var/log, syslog, Authentifizierungsprotokolle, Kernel-Protokolle, logrotate, Systemprotokollierung, Protokollverwaltung"
  es:
    title: "Registros del Sistema"
    description: "Aprende sobre los registros del sistema y el directorio /var/log."
    faqs:
      - question: "¿Qué registros de Linux se explican?"
        answer: "El curso cubre registros generales del sistema, eventos de autenticación, mensajes del kernel, syslog, archivos comunes en /var/log y rotación de registros."
      - question: "¿Las ubicaciones de los registros difieren entre las distribuciones?"
        answer: "Sí. Los nombres de archivos y los servicios de registro pueden variar, pero el curso enseña conceptos que le ayudarán a identificar la fuente relevante en su sistema."
      - question: "¿Por qué es necesaria la rotación de registros?"
        answer: "La rotación limita el crecimiento del almacenamiento y al mismo tiempo conserva el historial útil, lo que ayuda a los sistemas a evitar el agotamiento del disco y mantiene los registros archivados manejables."
    meta_title: "Curso de registro del sistema Linux"
