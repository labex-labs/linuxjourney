        answer: "Курс охватывает общие системные журналы, события аутентификации, сообщения ядра, syslog, распространённые файлы в /var/log и ротацию журналов."
      - question: "Различается ли расположение журналов в разных дистрибутивах?"
        answer: "Да. Имена файлов и службы ведения журналов могут различаться, но в курсе изучаются концепции, которые помогут вам определить соответствующий источник в вашей системе."
      - question: "Зачем нужна ротация журналов?"
        answer: "Ротация ограничивает рост хранилища, сохраняя при этом полезную историю, помогая системам избежать нехватки дисков и обеспечивая управляемость архивных журналов."
