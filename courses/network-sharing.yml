      - question: "¿Debería usar NFS o Samba?"
        answer: "NFS es común entre sistemas tipo Unix, mientras que Samba es útil para la compatibilidad SMB en Linux, Windows y otros clientes. Su red determina la mejor opción."
      - question: "¿Es seguro un servidor HTTP simple para uso público?"
        answer: "El servidor simple de la lección está diseñado para compartir y probar localmente de forma controlada, no como un servidor web público reforzado. Evite exponer directorios confidenciales."
