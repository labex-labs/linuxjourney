translations:
  en:
    title: "Network Sharing"
    description: "Learn about network sharing with rsync, scp, nfs, and more."
    faqs:
      - question: "Which sharing methods are covered?"
        answer: "The course introduces file-sharing concepts, rsync, NFS, Samba, and a simple Python HTTP server so you can compare synchronization and network access methods."
      - question: "Should I use NFS or Samba?"
        answer: "NFS is common between Unix-like systems, while Samba is useful for SMB compatibility across Linux, Windows, and other clients. Your network determines the best fit."
      - question: "Is a simple HTTP server safe for public use?"
        answer: "The lesson’s simple server is intended for controlled local sharing and testing, not as a hardened public web server. Avoid exposing sensitive directories."
    meta_title: "Linux Network File Sharing Course"
    meta_description: "Learn practical Linux network sharing with rsync, secure copy concepts, NFS, Samba, and a simple HTTP server for local file access."
    meta_keywords: "Linux file sharing, rsync, NFS, Samba, simple HTTP server, network shares, file synchronization"
  de:
    title: "Netzwerkfreigabe"
    description: "Lernen Sie die Netzwerkfreigabe mit rsync, scp, nfs und mehr kennen."
    faqs:
      - question: "Welche Sharing-Methoden werden abgedeckt?"
        answer: "Der Kurs stellt Dateifreigabekonzepte, rsync, NFS, Samba und einen einfachen Python-HTTP-Server vor, sodass Sie Synchronisierungs- und Netzwerkzugriffsmethoden vergleichen können."
      - question: "Sollte ich NFS oder Samba verwenden?"
        answer: "NFS ist bei Unix-ähnlichen Systemen üblich, während Samba für die SMB-Kompatibilität zwischen Linux, Windows und anderen Clients nützlich ist. Ihr Netzwerk bestimmt die beste Lösung."
      - question: "Ist ein einfacher HTTP-Server für die öffentliche Nutzung sicher?"
        answer: "Der einfache Server der Lektion ist für die kontrollierte lokale Freigabe und zum Testen gedacht und nicht als gehärteter öffentlicher Webserver. Vermeiden Sie es, vertrauliche Verzeichnisse offenzulegen."
    meta_title: "Kurs zur Linux-Netzwerkdateifreigabe"
    meta_description: "Lernen Sie die praktische Linux-Netzwerkfreigabe mit rsync, sicheren Kopierkonzepten, NFS, Samba und einem einfachen HTTP-Server für den lokalen Dateizugriff kennen."
    meta_keywords: "Linux-Dateifreigabe, Rsync, NFS, Samba, einfacher HTTP-Server, Netzwerkfreigaben, Dateisynchronisierung"
  es:
