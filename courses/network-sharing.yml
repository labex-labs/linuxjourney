  ru:
    title: "Совместное использование сети"
    description: "Узнайте о совместном использовании сети с помощью rsync, scp, nfs и других."
    faqs:
      - question: "Какие способы обмена охвачены?"
        answer: "В курсе представлены концепции совместного использования файлов, rsync, NFS, Samba и простой HTTP-сервер Python, чтобы вы могли сравнить методы синхронизации и доступа к сети."
      - question: "Что мне следует использовать: NFS или Samba?"
        answer: "NFS обычно используется в Unix-подобных системах, а Samba полезна для совместимости SMB с Linux, Windows и другими клиентами. Ваша сеть определяет наиболее подходящий вариант."
      - question: "Безопасен ли простой HTTP-сервер для публичного использования?"
        answer: "Простой сервер урока предназначен для контролируемого локального обмена и тестирования, а не как защищенный общедоступный веб-сервер. Избегайте раскрытия конфиденциальных каталогов."
