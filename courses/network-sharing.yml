  ja:
    title: "ネットワーク共有"
    description: "rsync、scp、nfs などを使ったネットワーク共有について学びましょう。"
    faqs:
      - question: "どの共有方法が対象ですか？"
        answer: "このコースでは、ファイル共有の概念、rsync、NFS、Samba、および単純な Python HTTP サーバーを紹介し、同期とネットワーク アクセス方法を比較できます。"
      - question: "NFS と Samba を使用する必要がありますか？"
        answer: "NFS は Unix 系システム間で一般的ですが、Samba は Linux、Windows、およびその他のクライアント間での SMB 互換性に役立ちます。ネットワークによって最適な適合性が決まります。"
      - question: "単純な HTTP サーバーは公共で使用しても安全ですか？"
        answer: "レッスンのシンプルなサーバーは、強化されたパブリック Web サーバーとしてではなく、制御されたローカル共有とテストを目的としています。機密性の高いディレクトリを公開しないようにします。"
    meta_title: "Linux ネットワーク ファイル共有コース"
    meta_description: "rsync を使用した実践的な Linux ネットワーク共有、セキュア コピーの概念、NFS、Samba、ローカル ファイル アクセス用のシンプルな HTTP サーバーについて学びます。"
    meta_keywords: "Linux ファイル共有，rsync, NFS, Samba, シンプルな HTTP サーバー, ネットワーク共有，ファイル同期"
  ko:
    title: "네트워크 공유"
    description: "rsync, scp, NFS 등을 사용한 네트워크 공유 방법을 알아보세요."
    faqs:
      - question: "어떤 공유 방법이 적용되나요?"
        answer: "이 과정에서는 파일 공유 개념, rsync, NFS, Samba 및 간단한 Python HTTP 서버를 소개하므로 동기화 및 네트워크 액세스 방법을 비교할 수 있습니다."
      - question: "NFS 를 사용해야 할까요, 아니면 Samba 를 사용해야 할까요?"
        answer: "NFS 는 Unix 계열 시스템에서 일반적으로 사용되는 반면 Samba 는 Linux, Windows 및 기타 클라이언트 간의 SMB 호환성에 유용합니다. 귀하의 네트워크가 가장 적합한 것을 결정합니다."
      - question: "간단한 HTTP 서버는 공개적으로 사용해도 안전한가요?"
        answer: "이 강의의 단순 서버는 강화된 공개 웹 서버가 아닌 제어된 로컬 공유 및 테스트를 위한 것입니다. 민감한 디렉터리를 노출하지 마세요."
