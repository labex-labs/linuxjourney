translations:
  en:
    title: 'Network Basics'
    description: 'Learn about networking basics and the TCP/IP model.'
    faqs:
      - question: 'What networking models will I learn?'
        answer: 'The course explains both the OSI and TCP/IP models and connects them to the link, network, transport, and application layers used in real networks.'
      - question: 'Is previous networking experience required?'
        answer: 'No. The lessons introduce core terminology, addressing, DHCP, and layered communication before later courses cover subnetting, routing, and configuration.'
      - question: 'Why learn both OSI and TCP/IP?'
        answer: 'The OSI model is useful for reasoning and troubleshooting, while the TCP/IP model more directly reflects the protocol suite used by modern networks.'
    meta_title: 'Computer Networking Basics Course'
    meta_description: 'Build a foundation in networking with the OSI and TCP/IP models, addressing, DHCP, and the link, network, transport, and application layers.'
    meta_keywords: 'networking basics, OSI model, TCP IP model, DHCP, network addressing, link layer, transport layer, application layer'
