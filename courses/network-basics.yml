  ru:
    title: "Основы сети"
    description: "Изучите основы компьютерных сетей и модель TCP/IP."
    faqs:
      - question: "Какие сетевые модели я изучу?"
        answer: "Курс объясняет модели OSI и TCP/IP и связывает их с канальным, сетевым, транспортным и прикладным уровнями, используемыми в реальных сетях."
      - question: "Требуется ли предыдущий опыт работы в сети?"
        answer: "Нет. На уроках знакомятся с основной терминологией, адресацией, DHCP и многоуровневой связью, а затем в последующих курсах рассматриваются подсети, маршрутизация и настройка."
      - question: "Зачем изучать OSI и TCP/IP?"
        answer: "Модель OSI полезна для рассуждений и устранения неполадок, тогда как модель TCP/IP более непосредственно отражает набор протоколов, используемый современными сетями."
    meta_title: "Курс по основам компьютерных сетей"
    meta_description: "Создайте основу для сетевых технологий с помощью моделей OSI и TCP/IP, адресации, DHCP, а также канального, сетевого, транспортного и прикладного уровней."
    meta_keywords: "основы работы в сети, модель OSI, модель TCP IP, DHCP, сетевая адресация, канальный уровень, транспортный уровень, прикладной уровень."
  zh:
    title: "网络基础"
    description: "了解网络基础知识和 TCP/IP 模型。"
    faqs:
      - question: "我将学习哪些网络模型？"
        answer: "本课程解释了 OSI 和 TCP/IP 模型，并将它们连接到实际网络中使用的链路、网络、传输和应用层。"
      - question: "需要有网络经验吗​​？"
        answer: "不会。这些课程先介绍核心术语、寻址、DHCP 和分层通信，然后再介绍子网划分、路由和配置。"
      - question: "为什么要同时学习 OSI 和 TCP/IP？"
        answer: "OSI 模型对于推理和故障排除很有用，而 TCP/IP 模型更直接地反映了现代网络使用的协议套件。"
