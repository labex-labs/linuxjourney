translations:
  en:
    title: 'The Filesystem'
    description: 'Learn about the Linux filesystem, the different types of filesystems, partitioning, and more.'
    faqs:
      - question: 'What storage topics are covered?'
        answer: 'The course covers disk anatomy, partitioning, filesystem types and creation, mounting, /etc/fstab, inodes, links, swap, usage reporting, and repair.'
      - question: 'Will I need a spare disk to follow the course?'
        answer: 'No. You can learn the concepts without changing a disk. Use a disposable virtual disk or test environment before practicing partitioning or repair commands.'
      - question: 'What is the difference between a disk and a filesystem?'
        answer: 'A disk is a storage device that may contain partitions, while a filesystem organizes files and metadata inside a partition or other storage volume.'
    meta_title: 'Linux Filesystem Course | Linux Journey'
    meta_description: 'Explore Linux filesystems, disk layout, partitions, inodes, mounting, fstab, swap, links, disk usage, creation, and filesystem repair.'
    meta_keywords: 'Linux filesystem, disk partitioning, mount, fstab, inodes, swap, symlinks, filesystem repair, disk usage'
