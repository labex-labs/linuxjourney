    title: 'Subnetting'
    description: 'Learn about subnets and how to do subnet arithmetic!'
    faqs:
      - question: 'What calculations will I learn?'
        answer: 'You will learn how addresses, prefix lengths, subnet masks, and host ranges relate, with subnet arithmetic and a practical reference lesson.'
      - question: 'Does the course cover both IPv4 and IPv6?'
        answer: 'Yes. Separate lessons introduce IPv4 and IPv6, while the subnet and CIDR concepts help you reason about address allocation.'
      - question: 'Should I understand binary numbers first?'
        answer: 'Basic binary familiarity is helpful, but the subnet math lessons are designed to build the connection between bits, prefixes, masks, and address ranges.'
