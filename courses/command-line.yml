      - question: "Une expérience préalable en ligne de commande est-elle requise ?"
        answer: "Non. Les leçons commencent par le shell et la navigation de base, puis évoluent vers les opérations quotidiennes sur les fichiers, la découverte de commandes et l'utilisation efficace du terminal."
