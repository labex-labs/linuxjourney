  ja:
    title: "コマンドライン"
    description: "コマンドラインの基本、ファイルやディレクトリの操作などを学びましょう。"
    faqs:
      - question: "このコースではどのようなコマンドがカバーされますか？"
        answer: "このコースでは、pwd、ls、cd、mkdir、touch、cp、mv、rm、cat、less、find、man、history、エイリアスなどのコア コマンドを取り上げます。"
      - question: "コマンドラインの経験は必要ですか？"
        answer: "いいえ。レッスンはシェルと基本的なナビゲーションから始まり、その後、日常的なファイル操作、コマンドの検出、ターミナルの効率的な使用に向けて構築されます。"
      - question: "macOS または Windows でレッスンを受講できますか？"
        answer: "多くの概念は macOS ターミナルや Windows Linux 環境でも機能しますが、最も一貫したエクスペリエンスを提供するのは Linux シェルです。"
    meta_title: "Linux コマンドラインコース"
    meta_description: "ディレクトリの移動、ファイルの管理、ヘルプの検索、コンテンツの検査、シェルでの効率的な作業のための重要な Linux コマンドライン スキルを学びます。"
    meta_keywords: "Linux コマンド ライン，シェルの基本，ls コマンド，cd コマンド，ファイル管理，ターミナル チュートリアル，Linux コマンド"
  ko:
