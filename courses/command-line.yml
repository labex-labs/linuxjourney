translations:
  en:
    title: 'Command Line'
    description: 'Learn the fundamentals of the command line, navigating files, directories, and more.'
    faqs:
      - question: 'What commands are covered in this course?'
        answer: 'The course covers core commands including pwd, ls, cd, mkdir, touch, cp, mv, rm, cat, less, find, man, history, and aliases.'
      - question: 'Is prior command-line experience required?'
        answer: 'No. The lessons begin with the shell and basic navigation, then build toward everyday file operations, command discovery, and efficient terminal use.'
      - question: 'Can I follow the lessons on macOS or Windows?'
        answer: 'Many concepts also work in macOS terminals and Windows Linux environments, but a Linux shell provides the most consistent experience.'
    meta_title: 'Linux Command Line Course | Linux Journey'
    meta_description: 'Learn essential Linux command-line skills for navigating directories, managing files, finding help, inspecting content, and working efficiently in a shell.'
    meta_keywords: 'Linux command line, shell basics, ls command, cd command, file management, terminal tutorial, Linux commands'
