translations:
  en:
    title: "Command Line"
    description: "Learn the fundamentals of the command line, navigating files, directories, and more."
    faqs:
      - question: "What commands are covered in this course?"
        answer: "The course covers core commands including pwd, ls, cd, mkdir, touch, cp, mv, rm, cat, less, find, man, history, and aliases."
      - question: "Is prior command-line experience required?"
        answer: "No. The lessons begin with the shell and basic navigation, then build toward everyday file operations, command discovery, and efficient terminal use."
      - question: "Can I follow the lessons on macOS or Windows?"
        answer: "Many concepts also work in macOS terminals and Windows Linux environments, but a Linux shell provides the most consistent experience."
    meta_title: "Linux Command Line Course"
    meta_description: "Learn essential Linux command-line skills for navigating directories, managing files, finding help, inspecting content, and working efficiently in a shell."
    meta_keywords: "Linux command line, shell basics, ls command, cd command, file management, terminal tutorial, Linux commands"
  de:
    title: "Befehlszeile"
    description: "Lernen Sie die Grundlagen der Befehlszeile sowie die Navigation in Dateien und Verzeichnissen."
    faqs:
      - question: "Welche Befehle werden in diesem Kurs behandelt?"
        answer: "Der Kurs behandelt grundlegende Befehle wie pwd, ls, cd, mkdir, touch, cp, mv, rm, cat, less, find, man und history sowie Aliase."
      - question: "Sind Vorkenntnisse in der Befehlszeile erforderlich?"
        answer: "Nein. Die Lektionen beginnen mit der Shell und der grundlegenden Navigation und bauen dann auf alltägliche Dateioperationen, Befehlserkennung und effiziente Terminalnutzung auf."
      - question: "Kann ich den Lektionen auf macOS oder Windows folgen?"
        answer: "Viele Konzepte funktionieren auch in macOS-Terminals und Windows-Linux-Umgebungen, aber eine Linux-Shell bietet das konsistenteste Erlebnis."
    meta_title: "Linux-Befehlszeilenkurs"
    meta_description: "Erlernen Sie grundlegende Linux-Befehlszeilenfähigkeiten zum Navigieren in Verzeichnissen, Verwalten von Dateien, Suchen von Hilfe, Überprüfen von Inhalten und effizientes Arbeiten in einer Shell."
    meta_keywords: "Linux-Befehlszeile, Shell-Grundlagen, ls-Befehl, cd-Befehl, Dateiverwaltung, Terminal-Tutorial, Linux-Befehle"
  es:
    title: "Línea de Comandos"
    description: "Aprende los fundamentos de la línea de comandos y a navegar por archivos y directorios."
    faqs:
      - question: "¿Qué comandos se tratan en este curso?"
        answer: "El curso cubre comandos básicos como pwd, ls, cd, mkdir, touch, cp, mv, rm, cat, less, find, man y history, además de los alias."
      - question: "¿Se requiere experiencia previa en línea de comandos?"
        answer: "No. Las lecciones comienzan con el shell y la navegación básica, luego avanzan hacia las operaciones diarias de archivos, el descubrimiento de comandos y el uso eficiente de la terminal."
      - question: "¿Puedo seguir las lecciones en macOS o Windows?"
        answer: "Muchos conceptos también funcionan en terminales macOS y entornos Windows Linux, pero un shell de Linux proporciona la experiencia más consistente."
    meta_title: "Curso de línea de comandos de Linux"
    meta_description: "Aprenda habilidades esenciales de línea de comandos de Linux para navegar por directorios, administrar archivos, buscar ayuda, inspeccionar contenido y trabajar de manera eficiente en un shell."
