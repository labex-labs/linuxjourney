      - question: "사전 명령줄 경험이 필요합니까?"
        answer: "아니요. 수업은 셸 및 기본 탐색으로 시작한 다음 일상적인 파일 작업, 명령 검색 및 효율적인 터미널 사용을 중심으로 진행됩니다."
      - question: "macOS 나 Windows 에서 강의를 따라갈 수 있나요?"
        answer: "많은 개념이 macOS 터미널 및 Windows Linux 환경에서도 작동하지만 Linux 셸은 가장 일관된 환경을 제공합니다."
