  ru:
    title: "Начало работы"
    description: "Что такое Linux? Начните с выбора дистрибутива и установки."
    faqs:
      - question: "Чему я научусь на этом курсе?"
        answer: "Вы узнаете, что такое Linux, как он развивался и чем отличаются основные дистрибутивы, такие как Ubuntu, Debian, Fedora, Arch Linux и Linux Mint."
      - question: "Подходит ли этот курс для начинающих?"
        answer: "Да. Курс предполагает отсутствие предыдущего опыта работы с Linux и предоставляет необходимую базовую информацию, прежде чем перейти к темам командной строки и системы."
      - question: "Нужно ли мне устанавливать Linux перед запуском?"
        answer: "Нет. Вы можете сначала изучить руководства по дистрибутиву и решить, какая среда Linux, виртуальная машина или работающая система лучше всего соответствует вашим потребностям."
    meta_title: "Начало работы с Linux"
    meta_description: "Начните изучение Linux с изучения его истории, основных дистрибутивов, вариантов установки и того, как выбрать подходящую систему Linux для ваших целей."
    meta_keywords: "Основы Linux, дистрибутивы Linux, выбор дистрибутива Linux, Ubuntu, Debian, Fedora, Arch Linux"
  zh:
    title: "入门"
    description: "什么是 Linux？从选择发行版和安装开始。"
