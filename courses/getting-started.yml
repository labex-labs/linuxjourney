translations:
  en:
    title: "Getting Started"
    description: "What is Linux? Get started with choosing a distribution and installation."
    faqs:
      - question: "What will I learn in this course?"
        answer: "You will learn what Linux is, how it developed, and how major distributions such as Ubuntu, Debian, Fedora, Arch Linux, and Linux Mint differ."
      - question: "Is this course suitable for complete beginners?"
        answer: "Yes. The course assumes no previous Linux experience and provides the background you need before moving on to command-line and system topics."
      - question: "Do I need to install Linux before starting?"
        answer: "No. You can study the distribution guides first and decide which Linux environment, virtual machine, or live system best fits your needs."
    meta_title: "Getting Started with Linux"
    meta_description: "Start learning Linux by exploring its history, major distributions, installation choices, and how to select the right Linux system for your goals."
    meta_keywords: "Linux basics, Linux distributions, choose a Linux distro, Ubuntu, Debian, Fedora, Arch Linux"
  de:
    title: "Erste Schritte"
    description: "Was ist Linux? Beginnen Sie mit der Auswahl einer Distribution und der Installation."
    faqs:
      - question: "Was werde ich in diesem Kurs lernen?"
        answer: "Sie erfahren, was Linux ist, wie es sich entwickelt hat und wie sich große Distributionen wie Ubuntu, Debian, Fedora, Arch Linux und Linux Mint unterscheiden."
      - question: "Ist dieser Kurs für absolute Anfänger geeignet?"
        answer: "Ja. Der Kurs setzt keine Linux-Vorkenntnisse voraus und vermittelt den Hintergrund, den Sie benötigen, bevor Sie mit Befehlszeilen- und Systemthemen fortfahren."
      - question: "Muss ich Linux installieren, bevor ich anfange?"
        answer: "Nein. Sie können zunächst die Verteilungshandbücher lesen und entscheiden, welche Linux-Umgebung, virtuelle Maschine oder welches Live-System Ihren Anforderungen am besten entspricht."
    meta_title: "Erste Schritte mit Linux"
    meta_description: "Beginnen Sie mit dem Erlernen von Linux, indem Sie seine Geschichte, die wichtigsten Distributionen, Installationsoptionen und die Auswahl des richtigen Linux-Systems für Ihre Ziele erkunden."
    meta_keywords: "Linux-Grundlagen, Linux-Distributionen, wählen Sie eine Linux-Distribution, Ubuntu, Debian, Fedora, Arch Linux"
  es:
    title: "Primeros Pasos"
    description: "¿Qué es Linux? Comienza eligiendo una distribución e instalación."
    faqs:
      - question: "¿Qué aprenderé en este curso?"
        answer: "Aprenderá qué es Linux, cómo se desarrolló y en qué se diferencian las principales distribuciones como Ubuntu, Debian, Fedora, Arch Linux y Linux Mint."
      - question: "¿Este curso es adecuado para principiantes?"
        answer: "Sí. El curso no asume ninguna experiencia previa en Linux y proporciona los conocimientos básicos que necesita antes de pasar a temas de sistema y línea de comandos."
      - question: "¿Necesito instalar Linux antes de comenzar?"
        answer: "No. Primero puede estudiar las guías de distribución y decidir qué entorno Linux, máquina virtual o sistema en vivo se adapta mejor a sus necesidades."
    meta_title: "Introducción a Linux"
    meta_description: "Comience a aprender Linux explorando su historia, sus principales distribuciones, opciones de instalación y cómo seleccionar el sistema Linux adecuado para sus objetivos."
    meta_keywords: "Conceptos básicos de Linux, distribuciones de Linux, elija una distribución de Linux, Ubuntu, Debian, Fedora, Arch Linux"
  fr:
    title: "Démarrage"
    description: "Qu'est-ce que Linux ? Commencez par choisir une distribution et l'installation."
    faqs:
      - question: "Que vais-je apprendre dans ce cours ?"
        answer: "Vous apprendrez ce qu'est Linux, comment il s'est développé et en quoi les principales distributions telles que Ubuntu, Debian, Fedora, Arch Linux et Linux Mint diffèrent."
      - question: "Ce cours est-il adapté aux débutants complets ?"
        answer: "Oui. Le cours ne suppose aucune expérience préalable de Linux et fournit les connaissances dont vous avez besoin avant de passer aux sujets relatifs à la ligne de commande et au système."
      - question: "Dois-je installer Linux avant de commencer ?"
        answer: "Non. Vous pouvez d'abord étudier les guides de distribution et décider quel environnement Linux, machine virtuelle ou système live correspond le mieux à vos besoins."
    meta_title: "Premiers pas avec Linux"
    meta_description: "Commencez à apprendre Linux en explorant son historique, ses principales distributions, ses choix d'installation et comment sélectionner le système Linux adapté à vos objectifs."
