        answer: "您将了解 Linux 是什么、它是如何开发的，以及 Ubuntu、Debian、Fedora、Arch Linux 和 Linux Mint 等主要发行版有何不同。"
      - question: "这个课程适合完全的初学者吗？"
        answer: "是的。本课程假设您之前没有 Linux 经验，并提供您在继续命令行和系统主题之前所需的背景知识。"
      - question: "开始之前需要安装 Linux 吗？"
        answer: "不需要。您可以先研究发行指南，然后决定哪种 Linux 环境、虚拟机或实时系统最适合您的需求。"
