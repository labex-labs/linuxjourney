  ja:
    title: "はじめに"
    description: "Linux とは？ディストリビューションの選択とインストールから始めましょう。"
    faqs:
      - question: "このコースでは何を学びますか？"
        answer: "Linux とは何か、Linux がどのように開発されたか、Ubuntu、Debian、Fedora、Arch Linux、Linux Mint などの主要なディストリビューションがどのように異なるかを学びます。"
      - question: "このコースは完全な初心者に適していますか？"
        answer: "はい。このコースは Linux の経験がないことを前提としており、コマンドラインとシステムのトピックに進む前に必要な背景を提供します。"
      - question: "開始する前に Linux をインストールする必要がありますか？"
        answer: "いいえ。まず配布ガイドを調べて、どの Linux 環境、仮想マシン、またはライブ システムがニーズに最も適しているかを決定できます。"
    meta_title: "Linux 入門"
    meta_description: "Linux の歴史、主要なディストリビューション、インストールの選択肢、および目的に適した Linux システムの選択方法を調べて、Linux の学習を始めましょう。"
    meta_keywords: "Linux の基本，Linux ディストリビューション，Linux ディストリビューションの選択，Ubuntu, Debian, Fedora, Arch Linux"
  ko:
    title: "시작하기"
    description: "Linux 란 무엇인가요? 배포판 선택 및 설치부터 시작하세요."
    faqs:
      - question: "이 강좌에서는 무엇을 배우나요?"
        answer: "Linux 가 무엇인지, 어떻게 개발되었는지, Ubuntu, Debian, Fedora, Arch Linux, Linux Mint 와 같은 주요 배포판이 어떻게 다른지 알아보세요."
      - question: "이 강좌는 완전 초보자에게 적합한가요?"
        answer: "네. 이 과정에서는 이전 Linux 경험이 없다고 가정하고 명령줄 및 시스템 주제로 넘어가기 전에 필요한 배경 지식을 제공합니다."
      - question: "시작하기 전에 Linux 를 설치해야 합니까?"
        answer: "아니요. 먼저 배포 가이드를 연구하고 귀하의 요구 사항에 가장 적합한 Linux 환경, 가상 머신 또는 라이브 시스템을 결정할 수 있습니다."
    meta_title: "Linux 시작하기"
    meta_description: "Linux 의 역사, 주요 배포판, 설치 선택 사항, 목표에 적합한 Linux 시스템을 선택하는 방법을 살펴보며 Linux 학습을 시작하세요."
    meta_keywords: "Linux 기본, Linux 배포판, Linux 배포판 선택, Ubuntu, Debian, Fedora, Arch Linux"
  pt:
    title: "Primeiros Passos"
    description: "O que é Linux? Comece escolhendo uma distribuição e fazendo a instalação."
    faqs:
      - question: "O que aprenderei neste curso?"
