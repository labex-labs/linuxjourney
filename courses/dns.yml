translations:
  en:
    title: "DNS"
    description: "Everything and more that you wanted to know about DNS."
    faqs:
      - question: "How does a DNS lookup work?"
        answer: "The course follows a query through clients, resolvers, root and authoritative name servers, explaining how components cooperate to return an answer."
      - question: "Which DNS tools will I learn?"
        answer: "You will learn practical lookup and diagnostic concepts using tools such as dig and nslookup, along with local resolver configuration and /etc/hosts."
      - question: "Is DNS only used for website addresses?"
        answer: "No. DNS stores multiple record types used for services, mail, verification, reverse lookups, and other forms of name-based discovery."
    meta_title: "DNS Fundamentals and Tools Course"
    meta_description: "Understand DNS components and query flow, local hosts files, resolver setup, record lookup tools, and practical DNS troubleshooting on Linux."
    meta_keywords: "DNS fundamentals, DNS lookup, dig command, nslookup, resolvers, DNS records, hosts file, DNS troubleshooting"
  de:
    title: "DNS"
    description: "Alles und mehr, was Sie über DNS wissen wollten."
    faqs:
      - question: "Wie funktioniert eine DNS-Suche?"
        answer: "Der Kurs folgt einer Abfrage über Clients, Resolver, Root- und autorisierende Nameserver und erklärt, wie Komponenten zusammenarbeiten, um eine Antwort zurückzugeben."
      - question: "Welche DNS-Tools werde ich lernen?"
        answer: "Sie lernen praktische Such- und Diagnosekonzepte mithilfe von Tools wie dig und nslookup sowie die lokale Resolver-Konfiguration und /etc/hosts kennen."
      - question: "Wird DNS nur für Website-Adressen verwendet?"
        answer: "Nein. DNS speichert mehrere Datensatztypen, die für Dienste, E-Mail, Überprüfung, Reverse-Lookups und andere Formen der namensbasierten Erkennung verwendet werden."
    meta_title: "DNS-Grundlagen- und Tools-Kurs"
    meta_description: "Verstehen Sie DNS-Komponenten und Abfragefluss, lokale Hostdateien, Resolver-Setup, Tools zur Datensatzsuche und praktische DNS-Fehlerbehebung unter Linux."
    meta_keywords: "DNS-Grundlagen, DNS-Suche, Dig-Befehl, nslookup, Resolver, DNS-Einträge, Hosts-Datei, DNS-Fehlerbehebung"
  es:
    title: "DNS"
    description: "Todo y más que querías saber sobre DNS."
    faqs:
      - question: "¿Cómo funciona una búsqueda de DNS?"
        answer: "El curso sigue una consulta a través de clientes, solucionadores, servidores raíz y de nombres autorizados, y explica cómo los componentes cooperan para devolver una respuesta."
      - question: "¿Qué herramientas de DNS aprenderé?"
        answer: "Aprenderá conceptos prácticos de búsqueda y diagnóstico utilizando herramientas como dig y nslookup, junto con la configuración del solucionador local y /etc/hosts."
      - question: "¿Se utiliza DNS solo para direcciones de sitios web?"
        answer: "No. DNS almacena múltiples tipos de registros utilizados para servicios, correo, verificación, búsquedas inversas y otras formas de descubrimiento basado en nombres."
    meta_title: "Curso de Fundamentos y Herramientas de DNS"
    meta_description: "Comprenda los componentes de DNS y el flujo de consultas, los archivos de hosts locales, la configuración del solucionador, las herramientas de búsqueda de registros y la solución práctica de problemas de DNS en Linux."
    meta_keywords: "Fundamentos de DNS, búsqueda de DNS, comando dig, nslookup, solucionadores, registros DNS, archivo de hosts, solución de problemas de DNS"
  fr:
    title: "DNS"
    description: "Tout ce que vous vouliez savoir et plus encore sur le DNS."
    faqs:
      - question: "Comment fonctionne une recherche DNS ?"
        answer: "Le cours suit une requête via des clients, des résolveurs, des serveurs de noms racine et faisant autorité, expliquant comment les composants coopèrent pour renvoyer une réponse."
      - question: "Quels outils DNS vais-je apprendre ?"
        answer: "Vous apprendrez les concepts pratiques de recherche et de diagnostic à l'aide d'outils tels que dig et nslookup, ainsi que la configuration du résolveur local et /etc/hosts."
      - question: "Le DNS est-il utilisé uniquement pour les adresses de sites Web ?"
        answer: "Non. DNS stocke plusieurs types d'enregistrements utilisés pour les services, le courrier, la vérification, les recherches inversées et d'autres formes de découverte basée sur le nom."
    meta_title: "Cours sur les principes fondamentaux et les outils du DNS"
    meta_description: "Comprendre les composants DNS et le flux de requêtes, les fichiers d'hôtes locaux, la configuration du résolveur, les outils de recherche d'enregistrement et le dépannage pratique du DNS sous Linux."
    meta_keywords: "Principes fondamentaux du DNS, recherche DNS, commande dig, nslookup, résolveurs, enregistrements DNS, fichier hosts, dépannage DNS"
  ja:
    title: "DNS"
    description: "DNS について知りたかったことすべて、そしてそれ以上を学びましょう。"
    faqs:
      - question: "DNS ルックアップはどのように機能しますか？"
        answer: "このコースでは、クライアント、リゾルバー、ルートおよび権威ネームサーバーを介したクエリに従い、コンポーネントがどのように連携して回答を返すかを説明します。"
      - question: "どの DNS ツールを学ぶことになりますか？"
        answer: "dig や nslookup などのツールを使用した実践的なルックアップと診断の概念、およびローカル リゾルバー設定や /etc/hosts を学びます。"
      - question: "DNS は Web サイトのアドレスにのみ使用されますか？"
        answer: "いいえ。DNS は、サービス、メール、検証、逆引き検索、およびその他の形式の名前ベースの検出に使用される複数のレコード タイプを保存します。"
    meta_title: "DNS の基礎とツールのコース"
    meta_description: "Linux での DNS コンポーネントとクエリ フロー、ローカル ホスト ファイル、リゾルバー セットアップ、レコード検索ツール、および実践的な DNS トラブルシューティングを理解します。"
    meta_keywords: "DNS の基礎，DNS ルックアップ，dig コマンド，nslookup, リゾルバー, DNS レコード，hosts ファイル，DNS トラブルシューティング"
  ko:
    title: "DNS"
    description: "DNS 에 대해 알고 싶었던 모든 것과 그 이상."
    faqs:
      - question: "DNS 조회는 어떻게 작동하나요?"
        answer: "이 과정에서는 클라이언트, 확인자, 루트 및 권한 있는 이름 서버를 통한 쿼리를 따라가며 구성 요소가 어떻게 협력하여 응답을 반환하는지 설명합니다."
      - question: "어떤 DNS 도구를 배우나요?"
        answer: "로컬 확인자 구성 및 /etc/hosts와 함께 dig 및 nslookup 과 같은 도구를 사용하여 실용적인 조회 및 진단 개념을 배우게 됩니다."
      - question: "DNS 는 웹사이트 주소에만 사용되나요?"
        answer: "아니요. DNS 는 서비스, 메일, 확인, 역방향 조회 및 기타 이름 기반 검색에 사용되는 다양한 레코드 유형을 저장합니다."
