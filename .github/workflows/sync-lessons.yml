name: Sync Learning Content to LabEx

on:
  push:
    branches: [master]
    paths:
      - "lessons/**/*.md"
      - "courses/*.yml"
      - "courses/*.yaml"
  workflow_dispatch:
    inputs:
      sync_path:
        description: "Lesson Markdown or course YAML file to sync"
        required: true
        type: string

jobs:
  sync-lessons:
    name: Sync changed learning content
    runs-on: ubuntu-latest

    env:
      LABEX_USERNAME: ${{ secrets.LABEX_USERNAME }}
      LABEX_X_AUTH: ${{ secrets.LABEX_X_AUTH }}
      LABEX_PASSWORD: ${{ secrets.LABEX_PASSWORD }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: labex-labs

      - name: Clean workspace
        run: |
          mkdir -p $WORKSPACE
          rm -rf "$WORKSPACE/labex-cli"
          echo "Workspace cleaned"
          ls -la $WORKSPACE

      - name: Checkout labex-cli
        uses: actions/checkout@v4
        with:
          repository: labex-labs/labex-cli
          path: labex-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout linuxjourney
        uses: actions/checkout@v4
        with:
          path: linuxjourney
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd labex-cli
          pip install -e .

      - name: Verify environment variables
        run: |
          for var in LABEX_USERNAME LABEX_X_AUTH LABEX_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Error: Missing environment variable $var"
              exit 1
            fi
          done
          echo "All required environment variables are set"

      - name: Sync changed content to LabEx
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SYNC_PATH: ${{ inputs.sync_path }}
        run: |
          cd linuxjourney

          CONTENT_PATHS=()
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              echo "Error: Cannot determine an incremental diff for the initial push"
              exit 1
            fi

            DELETED_PATHS=()
            while IFS= read -r -d '' file; do
              DELETED_PATHS+=("$file")
            done < <(
              git diff --name-only --diff-filter=D -z "$BASE_SHA" "$HEAD_SHA" -- \
                'lessons/**/*.md' 'courses/*.yml' 'courses/*.yaml'
            )
            if (( ${#DELETED_PATHS[@]} > 0 )); then
              echo "Error: The sync API does not support deleting content:"
              printf '  %s\n' "${DELETED_PATHS[@]}"
              exit 1
            fi

            while IFS= read -r -d '' file; do
              CONTENT_PATHS+=("$file")
            done < <(
              git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" -- \
                'lessons/**/*.md' 'courses/*.yml' 'courses/*.yaml'
            )
          else
            if [[ ! -f "$SYNC_PATH" ]] || \
              [[ ! "$SYNC_PATH" =~ ^(lessons/.+\.md|courses/.+\.ya?ml)$ ]]; then
              echo "Error: Specify an existing Lesson Markdown or course YAML file"
              exit 1
            fi
            CONTENT_PATHS+=("$SYNC_PATH")
          fi

          LESSON_ARGS=()
          COURSE_ARGS=()
          for file in "${CONTENT_PATHS[@]}"; do
            case "$file" in
              lessons/*.md)
                LESSON_ARGS+=(--lessons-path "../linuxjourney/$file")
                ;;
              courses/*.yml|courses/*.yaml)
                COURSE_ARGS+=(--courses-path "../linuxjourney/$file")
                ;;
            esac
          done

          if (( ${#LESSON_ARGS[@]} == 0 && ${#COURSE_ARGS[@]} == 0 )); then
            echo "No changed Learning content, skipping sync"
            exit 0
          fi

          cd ../labex-cli
          SYNC_COMMAND=(labex lesson sync-v2)
          SYNC_COMMAND+=("${COURSE_ARGS[@]}" "${LESSON_ARGS[@]}")
          if (( ${#LESSON_ARGS[@]} > 0 )); then
            SYNC_COMMAND+=(--all-langs)
          fi
          "${SYNC_COMMAND[@]}"

      - name: Notify completion
        run: |
          echo "Sync task completed"
          echo "Completion time: $(date)"
